name: publish

# 打 tag（如 v0.1.0）时自动发布到 npm，绕开本地连不上 registry.npmjs.org 的问题。
# 需要在仓库 Settings → Secrets and variables → Actions 里添加 NPM_TOKEN
# （npmjs.com → Access Tokens → Generate New Token，选 Automation 类型）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Config 自检需要这个可选 peer（本地由 DSH profile 提供，CI 里装上才能真正测到）
      - name: 准备可选依赖
        run: npm install --no-save --no-package-lock @deepseek-ai/schemastery@^3.18.1

      - name: 自检
        run: node scripts/check.mjs && node scripts/host-check.mjs

      # npm 现在对"绕过 2FA 的 token 直接发布新包"做了限制：先 stage，再由维护者在 npm 侧批准。
      - name: 发布（先 stage 到 npm，再由维护者批准）
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
